services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_SSLMODE=${DB_SSLMODE:-disable}
      - JWT_SECRET=${JWT_SECRET}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_PRIVATE_KEY_ID=${GCP_PRIVATE_KEY_ID}
      - GCP_PRIVATE_KEY=${GCP_PRIVATE_KEY}
      - GCP_CLIENT_EMAIL=${GCP_CLIENT_EMAIL}
      - GCP_CLIENT_ID=${GCP_CLIENT_ID}
      - GCP_CLIENT_X509_CERT_URL=${GCP_CLIENT_X509_CERT_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_SYNC_PRODUCTS_ON_STARTUP=${STRIPE_SYNC_PRODUCTS_ON_STARTUP:-false}
      - STRIPE_PREMIUM_INTRO_COUPON_ID=${STRIPE_PREMIUM_INTRO_COUPON_ID}
      - STRIPE_ULTIMATE_INTRO_COUPON_ID=${STRIPE_ULTIMATE_INTRO_COUPON_ID}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL}
      - EMAIL_FROM=${EMAIL_FROM}
      - SUPPORT_EMAIL_TO=${SUPPORT_EMAIL_TO}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_SSL=${SMTP_SSL}
      - EMAIL_LOG_RECIPIENTS=${EMAIL_LOG_RECIPIENTS}
      - EMAIL_LOG_SUBJECT=${EMAIL_LOG_SUBJECT}
      - JOB_MATCH_NOTIFIER_TRIGGER_TOKEN=${JOB_MATCH_NOTIFIER_TRIGGER_TOKEN}
      - GEMINI_RETRY_ENABLED=${GEMINI_RETRY_ENABLED:-false}
      - CLASSIFY_PER_JOB_DELAY_MS=${CLASSIFY_PER_JOB_DELAY_MS:-500}
      - CLASSIFY_BATCH_SIZE=${CLASSIFY_BATCH_SIZE:-5}
      - DISABLE_AI_BACKGROUND_JOBS=${DISABLE_AI_BACKGROUND_JOBS:-false}
      - DISABLE_JOB_AUTO_CLASSIFICATION=${DISABLE_JOB_AUTO_CLASSIFICATION:-false}
      - DISABLE_JOB_SYNC_SCHEDULER=${DISABLE_JOB_SYNC_SCHEDULER:-false}
      - JOB_SYNC_SCHEDULER_INTERVAL_MINUTES=${JOB_SYNC_SCHEDULER_INTERVAL_MINUTES:-}
      - MIN_JOB_SYNC_INTERVAL_MINUTES=${MIN_JOB_SYNC_INTERVAL_MINUTES:-1440}
      - GEMINI_CONCURRENCY=${GEMINI_CONCURRENCY:-4}
      - SYNC_WORKER_CONCURRENCY=${SYNC_WORKER_CONCURRENCY:-8}
      - NODE_ENV=prod
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - ai-resume-network

networks:
  ai-resume-network:
    external: true